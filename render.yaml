services:
  # FastAPI AI Backend Web Service on Render
  - type: web
    name: ekyc-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_V1_STR
        value: /api/v1
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: USE_SQLITE_FALLBACK
        value: "True"
      - key: GOOGLE_CLIENT_ID
        value: 992314878877-vvul89n1rol4ohtbkebhse4fs2npkgtn.apps.googleusercontent.com
      - key: DATABASE_URL
        fromDatabase:
          name: ekyc-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database on Render
  - name: ekyc-postgres
    databaseName: ekyc_db
    user: ekyc_user
    plan: free
