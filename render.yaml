services:
  # Unified Full-Stack Web Service (FastAPI + React UI on Same Domain)
  - type: web
    name: ekyc-backend
    env: python
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: USE_SQLITE_FALLBACK
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: API_V1_STR
        value: /api/v1
      - key: GOOGLE_CLIENT_ID
        value: 992314878877-vvul89n1rol4ohtbkebhse4fs2npkgtn.apps.googleusercontent.com

  # React Frontend Single-Page Application
  - type: web
    name: ekyc-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: ekyc-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        value: 992314878877-vvul89n1rol4ohtbkebhse4fs2npkgtn.apps.googleusercontent.com
